name: Pylint

on: [push]

jobs:
  build:
    name: Lint and Analyze Code
    runs-on: ubuntu-latest
    
    ### Janis Rubins - Step 1: Define a matrix for Python versions to ensure compatibility tests
    strategy:
      matrix:
        python-version: ["3.11", "3.10"]
    
    steps:
      ### Janis Rubins - Step 2: Check out repository code
      - name: Checkout code
        uses: actions/checkout@v4

      ### Janis Rubins - Step 3: Log the start of the job with environment and resource usage
      - name: Print job start info
        run: |
          echo "Job started at: $(date)"
          echo "Running on machine: $RUNNER_NAME"
          echo "Available CPUs: $(nproc)"
          echo "Memory info:"
          free -h

      ### Janis Rubins - Step 4: Set up the specified Python version
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}
      
      ### Janis Rubins - Step 5: Install and upgrade pip, then install dependencies
      - name: Install dependencies
        run: |
          echo "Upgrading pip..."
          python -m pip install --upgrade pip
          echo "Installing required dependencies from requirements.txt..."
          pip install -r requirements.txt

      ### Janis Rubins - Step 6: Run Pylint with logging and basic error handling
      - name: Analyzing the code with pylint
        id: pylint
        shell: bash
        run: |
          echo "Pylint analysis started at: $(date)"
          START_TIME=$(date +%s)

          # Wrap in a simple 'try-catch' style approach using shell conditionals
          # This helps us capture errors gracefully and log them.
          set +e  # Allow the script to continue on non-zero exit codes
          
          echo "Running pylint on all Python files..."
          pylint_output=$(pylint $(git ls-files '*.py') 2>&1)
          pylint_exit_code=$?

          END_TIME=$(date +%s)
          EXECUTION_TIME=$((END_TIME - START_TIME))

          echo "Pylint execution time: ${EXECUTION_TIME} seconds"

          # If pylint failed, log the output and exit code, but do not immediately stop the job
          if [ $pylint_exit_code -ne 0 ]; then
            echo "::error ::Pylint encountered issues:"
            echo "$pylint_output"
            echo "Pylint exit code was: $pylint_exit_code"
          else
            echo "Pylint completed successfully!"
          fi

          # Save pylint_output to file for artifact upload or further analysis
          echo "$pylint_output" > pylint.log

          # Re-enable immediate job failure on errors for subsequent steps
          set -e
          
          # Expose exit code for use in later steps
          echo "::set-output name=exit_code::$pylint_exit_code"

      ### Janis Rubins - Step 7: Capture artifacts (e.g., Pylint logs) for deeper analysis
      - name: Upload Pylint logs
        uses: actions/upload-artifact@v3
        with:
          name: pylint-logs
          path: pylint.log

      ### Janis Rubins - Step 8: Provide a final summary and exit logic
      - name: Final summary
        if: always()
        run: |
          # In a real-world scenario, you might further parse logs, 
          # post results to Slack, or handle errors differently.
          pylint_code=${{ steps.pylint.outputs.exit_code }}
          if [ "$pylint_code" -eq 0 ]; then
            echo "Linting succeeded. No major issues found."
          else
            echo "Linting encountered issues. Exit code: $pylint_code"
            # You could choose to fail or pass the job depending on your policy:
            # exit 1  # Un-comment to make the job fail on lint errors
          fi
          
          echo "Job finished at: $(date)"
